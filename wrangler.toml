# Cloudflare Pages config for the On Point Services site + CMS backend.
# Deployed with:  npx wrangler pages deploy . --project-name onpoint-services
name = "onpoint-services"
pages_build_output_dir = "."
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# CMS database (existing — holds pages, sections, blog, users, settings, enquiries, media)
[[d1_databases]]
binding = "DB"
database_name = "onpoint-cms"
database_id = "f29672ba-a4e0-4292-b9bc-b5e30303066e"

# Media library object storage
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "onpoint-media"
