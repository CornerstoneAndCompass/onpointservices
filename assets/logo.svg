<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="logo-mark" aria-label="On Point Services Ltd">
  <defs>
    <clipPath id="badge-clip"><circle cx="60" cy="60" r="58"/></clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="58" fill="#0A0A0A" stroke="#F4C518" stroke-width="2"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="#F4C518" stroke-width="1" opacity="0.35"/>

  <!-- Curved text around top: ON POINT -->
  <defs>
    <path id="topArc" d="M 18 60 A 42 42 0 0 1 102 60" />
    <path id="bottomArc" d="M 22 66 A 38 38 0 0 0 98 66" />
  </defs>
  <text font-family="Archivo Black, Helvetica, Arial, sans-serif" font-size="9" fill="#F4C518" letter-spacing="2.5" font-weight="900">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">ON POINT</textPath>
  </text>
  <text font-family="Archivo Black, Helvetica, Arial, sans-serif" font-size="7" fill="#F4C518" letter-spacing="3" font-weight="900">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">SERVICES LTD</textPath>
  </text>

  <!-- Star separators -->
  <circle cx="13" cy="60" r="1.5" fill="#F4C518"/>
  <circle cx="107" cy="60" r="1.5" fill="#F4C518"/>

  <!-- Center emblem: stylized plant/leaf -->
  <g transform="translate(60, 62)">
    <!-- Soil/ground arc -->
    <path d="M -22 14 Q 0 8 22 14" stroke="#F4C518" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Soil dots -->
    <circle cx="-14" cy="14" r="1" fill="#F4C518"/>
    <circle cx="-6" cy="13" r="1" fill="#F4C518"/>
    <circle cx="6" cy="13" r="1" fill="#F4C518"/>
    <circle cx="14" cy="14" r="1" fill="#F4C518"/>
    <!-- Center stem -->
    <path d="M 0 14 L 0 -8" stroke="#F4C518" stroke-width="2" stroke-linecap="round"/>
    <!-- Leaves -->
    <path d="M 0 -2 Q -10 -8 -14 -16 Q -8 -18 -2 -12 Q 0 -8 0 -2 Z" fill="#F4C518"/>
    <path d="M 0 -2 Q 10 -8 14 -16 Q 8 -18 2 -12 Q 0 -8 0 -2 Z" fill="#F4C518"/>
    <path d="M 0 -8 Q -6 -16 -4 -22 Q 2 -22 4 -16 Q 4 -12 0 -8 Z" fill="#F4C518"/>
  </g>
</svg>
